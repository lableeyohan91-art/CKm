name: Publication GitHub Pages
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main, claude/conversation-multi-browser-access-377wku]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publier:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
